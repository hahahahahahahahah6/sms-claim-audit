[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sms-claim-audit"
version = "0.1.0"
description = "Offline static audit of documented outbound text delivery"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"

[project.scripts]
sms-claim-audit = "sms_claim_audit.audit:main"

[tool.setuptools.packages.find]
include = ["sms_claim_audit*"]
